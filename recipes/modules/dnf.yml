---
modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      copr:
        - avengemedia/danklinux
        - avengemedia/dms
        - yalter/niri-git
    install:
      install-weak-deps: false
      # COPR packages are version-pinned; Fedora and Terra packages float.
      packages:
        - terra-release
        - greetd
        - dms-greeter-1.5.3-1.fc44
        - niri-0.0.git.2853.720c3884-1.fc44
        - qt6-qtwayland
        - qt5-qtwayland
        - dms-1.5.3-1.fc44
        - dgop-1:0.2.3-1.fc44
        - danksearch-0.3.2-1.fc44
        - sudo-rs
        - git
        - ghostty-1.3.1-1.fc44
        - qemu
        - chezmoi
        - topgrade
        - mise
        - podman-docker
        - podman-compose
        - distrobox
        - lm_sensors
        - power-profiles-daemon
        - openssl
        - cosmic-files
        - make
        - gcc
        - g++
        - brightnessctl
        - libsecret
        - timg
        - fcitx5
        - fcitx5-hangul
        - fcitx5-configtool
        - fcitx5-gtk
        - fcitx5-qt
        - pinentry
        - pinentry-curses
        - pinentry-tty
    remove:
      auto-remove: false
      packages:
        - flatpak
        - firefox
        - nano
