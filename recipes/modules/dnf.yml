---
modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      copr:
        - avengemedia/danklinux
        - avengemedia/dms
        - yalter/niri-git
    install:
      install-weak-deps: false
      packages:
        - terra-release
        - greetd
        - dms-greeter
        - niri
        - qt6-qtwayland
        - qt5-qtwayland
        - dms
        - dgop
        - dsearch
        - sudo-rs
        - git
        - ghostty
        - qemu
        - chezmoi
        - topgrade
        - mise
        - podman-docker
        - podman-compose
        - distrobox
        - lm_sensors
        - power-profiles-daemon
        - openssl
        - cosmic-files
        - make
        - gcc
        - g++
        - brightnessctl
        - libsecret
        - timg
        - fcitx5
        - fcitx5-hangul
        - fcitx5-configtool
        - fcitx5-gtk
        - fcitx5-qt
    remove:
      auto-remove: false
      packages:
        - flatpak
        - firefox
        - nano
